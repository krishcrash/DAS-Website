# Build and deploy deadauteursociety.com to GitHub Pages.
#
# Every push to main:
#   1. scripts/build_data.py   → scores, ranks, reviewer highlights (from master-data/*.csv)
#   2. scripts/build_charts.py → analytics charts
#   3. hugo                    → the static site (images resized/cached)
#   4. deploy to GitHub Pages
#
# Pull requests run steps 1–3 only, as a check. A monthly scheduled run keeps
# the "last twelve months" charts current even when nothing is pushed.
#
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".

name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 1 * *"   # 05:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a deploy that's already running.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: "0.166.0"
  PYTHON_VERSION: "3.12"
  TZ: Europe/London        # build timestamps and "last twelve months" use UK time

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Build score data
        run: python scripts/build_data.py

      - name: Build analytics charts
        run: python scripts/build_charts.py

      - name: Install Hugo
        run: |
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
          hugo version

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      # Resized posters are expensive to regenerate; keep them between runs.
      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-gen-${{ env.HUGO_VERSION }}-${{ hashFiles('assets/images/**', 'layouts/partials/frame.html', 'hugo.toml') }}
          restore-keys: hugo-gen-${{ env.HUGO_VERSION }}-

      - name: Build site
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          # On PRs there's no Pages URL; fall back to the configured baseURL.
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -n "$BASE_URL" ]; then
            hugo --gc --minify --baseURL "${BASE_URL%/}/"
          else
            hugo --gc --minify
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
